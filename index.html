<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Neil OS — 個人小系統</title>
<meta name="theme-color" content="#2F6D5F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neil OS">
<style>
  :root{
    --bg:#F3F5F4; --card:#FFFFFF; --ink:#1E2B28; --muted:#6E7D78;
    --line:#E2E8E5; --accent:#2F6D5F; --accent-soft:#E4EFEA;
    --danger:#C24A3A;
    --m1:#C24A3A; --m2:#D98E32; --m3:#9AA79F; --m4:#5FA985; --m5:#2F6D5F;
    --compass:#4A6FA5; --compass-soft:#E8EEF7;
    --output:#7B5EA7; --output-soft:#F0EBF8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    font-size:16px; line-height:1.5;
  }
  header{
    padding:20px 20px 12px; background:var(--bg);
    position:sticky; top:0; z-index:5;
  }
  .eyebrow{font-size:12px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase;}
  h1{margin:2px 0 0; font-size:26px; font-weight:700; letter-spacing:-0.02em;}
  .pulse{display:flex; gap:5px; margin-top:12px; align-items:flex-end; height:22px;}
  .pulse span{width:100%; max-width:18px; border-radius:3px; background:var(--line); flex:1;}
  .pulse .l1{background:var(--m1); height:30%;}
  .pulse .l2{background:var(--m2); height:45%;}
  .pulse .l3{background:var(--m3); height:60%;}
  .pulse .l4{background:var(--m4); height:80%;}
  .pulse .l5{background:var(--m5); height:100%;}
  .pulse .empty{height:20%; opacity:.5;}
  .pulse-label{font-size:11px; color:var(--muted); margin-top:6px;}

  main{padding:8px 16px 16px;}
  .view{display:none;}
  .view.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h2{margin:0 0 10px; font-size:15px; font-weight:600; color:var(--muted);}

  input[type=text], textarea, select{
    width:100%; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font:inherit; background:#FBFCFB; color:var(--ink);
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent;}
  button{font:inherit; cursor:pointer;}
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:10px 16px; font-weight:600; width:100%;
  }
  .btn:active{opacity:.85;}
  .btn-outline{
    background:transparent; color:var(--accent); border:1.5px solid var(--accent);
    border-radius:10px; padding:8px 16px; font-weight:600;
  }
  .row{display:flex; gap:8px;}
  .row input{flex:1;}
  .row .btn{width:auto; white-space:nowrap;}

  /* 任務 */
  .task{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);}
  .task:last-child{border-bottom:none;}
  .task input[type=checkbox]{width:20px; height:20px; accent-color:var(--accent); flex:none;}
  .task .txt{flex:1; word-break:break-word;}
  .task.done .txt{color:var(--muted); text-decoration:line-through;}
  .del{background:none; border:none; color:var(--muted); font-size:18px; padding:4px 8px; flex:none;}
  .del:active{color:var(--danger);}
  .empty-hint{color:var(--muted); font-size:14px; text-align:center; padding:16px 0;}

  /* 心情 */
  .moods{display:flex; gap:6px; justify-content:space-between; margin-bottom:10px;}
  .mood-btn{
    flex:1; background:#FBFCFB; border:1px solid var(--line); border-radius:12px;
    font-size:24px; padding:10px 0;
  }
  .mood-btn.sel{border-color:var(--accent); background:var(--accent-soft);}
  .mood-item{display:flex; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); align-items:flex-start;}
  .mood-item:last-child{border-bottom:none;}
  .mood-emoji{font-size:20px; flex:none;}
  .mood-meta{font-size:12px; color:var(--muted);}

  /* 日誌 / 複盤 */
  .field-label{font-size:13px; font-weight:600; margin:10px 0 4px; color:var(--ink);}
  .field-label:first-child{margin-top:0;}
  .review-item{padding:10px 4px; border-bottom:1px solid var(--line);}
  .review-item:last-child{border-bottom:none;}
  .review-date{font-weight:600; font-size:14px; color:var(--accent);}
  .review-body{font-size:14px; color:var(--ink); white-space:pre-wrap; margin-top:4px;}
  .saved-tag{font-size:12px; color:var(--accent); margin-left:8px;}

  /* Daily Compass 卡片 */
  .compass-card{
    background:var(--compass-soft); border:1.5px solid #C4D4EA;
    border-radius:14px; padding:14px; margin-bottom:12px;
  }
  .compass-card .compass-label{
    font-size:13px; font-weight:700; color:var(--compass);
    letter-spacing:.04em; margin-bottom:6px; display:flex; align-items:center; gap:6px;
  }
  .compass-card textarea{background:#fff;}
  .compass-card textarea:focus{outline-color:var(--compass);}

  /* 雜記 */
  .note-item{padding:10px 4px; border-bottom:1px solid var(--line);}
  .note-item:last-child{border-bottom:none;}
  .note-txt{white-space:pre-wrap; word-break:break-word;}
  .note-meta{display:flex; justify-content:space-between; align-items:center; margin-top:4px;}

  /* 週回顧 */
  .toggle-row{display:flex; gap:8px; margin-top:6px;}
  .toggle-btn{
    flex:1; background:#FBFCFB; border:1.5px solid var(--line);
    border-radius:10px; padding:8px 4px; font-size:13px; font-weight:600; color:var(--muted);
    text-align:center;
  }
  .toggle-btn.sel-fear{border-color:var(--m2); background:#FDF3E3; color:#A0620A;}
  .toggle-btn.sel-value{border-color:var(--m5); background:var(--accent-soft); color:var(--accent);}
  .toggle-btn.sel-mix{border-color:var(--compass); background:var(--compass-soft); color:var(--compass);}

  .detector-box{
    background:#FFFBF0; border:1.5px solid #EDD98A;
    border-radius:12px; padding:12px; margin-top:10px;
  }
  .detector-label{font-size:13px; font-weight:700; color:#8A6A00; margin-bottom:8px;}
  .detector-toggle{display:flex; gap:8px;}
  .d-btn{
    flex:1; background:#fff; border:1.5px solid #EDD98A;
    border-radius:9px; padding:8px 4px; font-size:13px; font-weight:600;
    color:#8A6A00; text-align:center;
  }
  .d-btn.sel{background:#EDD98A; color:#5A4000;}

  .weekly-item{padding:12px 4px; border-bottom:1px solid var(--line);}
  .weekly-item:last-child{border-bottom:none;}
  .weekly-date{font-weight:600; font-size:13px; color:var(--compass);}
  .weekly-body{font-size:14px; color:var(--ink); white-space:pre-wrap; margin-top:4px;}
  .weekly-tag{
    display:inline-block; font-size:11px; font-weight:700; border-radius:6px;
    padding:2px 8px; margin-top:6px;
  }
  .tag-fear{background:#FDF3E3; color:#A0620A;}
  .tag-value{background:var(--accent-soft); color:var(--accent);}
  .tag-mix{background:var(--compass-soft); color:var(--compass);}
  .tag-serve{background:#F0EBF8; color:#6A3FA0;}
  .tag-delay{background:#FDE8E8; color:#A02020;}

  /* 輸出追蹤 */
  .output-type-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .type-btn{
    background:#FBFCFB; border:1.5px solid var(--line); border-radius:20px;
    padding:5px 12px; font-size:13px; color:var(--muted); font-weight:600;
  }
  .type-btn.sel{border-color:var(--output); background:var(--output-soft); color:var(--output);}

  .output-item{display:flex; align-items:flex-start; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);}
  .output-item:last-child{border-bottom:none;}
  .output-type-badge{
    font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px;
    background:var(--output-soft); color:var(--output); white-space:nowrap; flex:none; margin-top:2px;
  }
  .output-txt{flex:1; word-break:break-word;}
  .output-meta{font-size:12px; color:var(--muted); margin-top:2px;}

  /* 成長 tab 區塊標題 */
  .section-title{
    font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin:4px 0 10px;
  }

  /* 底部導覽 */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:10;
    display:flex; background:var(--card); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; padding:10px 0 8px;
    font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:2px; align-items:center;
  }
  nav button .ico{font-size:19px;}
  nav button.active{color:var(--accent); font-weight:600;}

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:8px 16px; border-radius:20px;
    font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="todayLabel"></div>
  <h1 id="viewTitle">任務</h1>
  <div class="pulse" id="pulse"></div>
  <div class="pulse-label" id="pulseLabel">近 14 天心情脈搏</div>
</header>

<main>
  <!-- 任務 -->
  <section class="view active" id="view-tasks">
    <div class="card">
      <div class="row">
        <input type="text" id="taskInput" placeholder="新增一個任務…" enterkeyhint="done">
        <button class="btn" onclick="addTask()">加入</button>
      </div>
    </div>
    <div class="card">
      <h2>進行中</h2>
      <div id="taskListOpen"></div>
    </div>
    <div class="card">
      <h2>已完成</h2>
      <div id="taskListDone"></div>
    </div>
  </section>

  <!-- 日誌（升級版複盤） -->
  <section class="view" id="view-review">
    <!-- Daily Compass：今日刻意選擇 -->
    <div class="compass-card">
      <div class="compass-label">🧭 今日指南針<span id="compassSaved" style="font-weight:400;font-size:12px;margin-left:6px;"></span></div>
      <textarea id="rvCompass" placeholder="今天你做了哪一個符合未來自己的選擇？哪怕只是一個小決定。" style="min-height:72px;"></textarea>
    </div>

    <!-- 當日複盤 -->
    <div class="card">
      <h2 id="reviewTitle">今日複盤<span class="saved-tag" id="reviewSaved"></span></h2>
      <div class="field-label">✅ 今天做得好的</div>
      <textarea id="rvGood" placeholder="哪件事值得記一筆？"></textarea>
      <div class="field-label">🪨 卡住的地方</div>
      <textarea id="rvStuck" placeholder="今天哪裡卡關、為什麼？"></textarea>
      <div class="field-label">🎯 明天最重要的一件事</div>
      <textarea id="rvNext" placeholder="只選一件，明天優先做它"></textarea>
      <div style="margin-top:12px"><button class="btn" onclick="saveReview()">儲存今日日誌</button></div>
    </div>
    <div class="card">
      <h2>過去的日誌</h2>
      <div id="reviewList"></div>
    </div>
  </section>

  <!-- 心情 -->
  <section class="view" id="view-mood">
    <div class="card">
      <h2>現在的心情</h2>
      <div class="moods" id="moodBtns"></div>
      <input type="text" id="moodNote" placeholder="想補充一句嗎？（可留空）">
      <div style="margin-top:10px"><button class="btn" onclick="addMood()">記錄心情</button></div>
    </div>
    <div class="card">
      <h2>心情紀錄</h2>
      <div id="moodList"></div>
    </div>
  </section>

  <!-- 雜記 -->
  <section class="view" id="view-notes">
    <div class="card">
      <textarea id="noteInput" placeholder="任何想法、待辦靈感、雜項…"></textarea>
      <div style="margin-top:10px"><button class="btn" onclick="addNote()">存下來</button></div>
    </div>
    <div class="card">
      <h2>雜記清單</h2>
      <div id="noteList"></div>
    </div>
    <div class="card">
      <h2>資料備份</h2>
      <p style="font-size:14px;color:var(--muted);margin:0 0 10px">資料存在這支手機的瀏覽器裡，建議定期匯出備份。</p>
      <button class="btn" onclick="exportData()">匯出 JSON 備份</button>
    </div>
  </section>

  <!-- 成長：週回顧 + 輸出追蹤 -->
  <section class="view" id="view-growth">

    <!-- 週回顧 -->
    <div class="section-title">📊 週回顧</div>
    <div class="card">
      <h2 id="weeklyTitle">本週決策回顧<span class="saved-tag" id="weeklySaved"></span></h2>

      <div class="field-label">這週做了哪些重要決定？</div>
      <textarea id="wkDecisions" placeholder="列出 1～3 個這週有意識做的選擇…"></textarea>

      <div class="field-label">我為什麼這樣選？</div>
      <textarea id="wkWhy" placeholder="動機是什麼？有沒有哪個選擇是靠直覺、哪個是靠分析？"></textarea>

      <div class="field-label">驅動力來源</div>
      <div class="toggle-row" id="driveToggle">
        <button class="toggle-btn" data-val="fear" onclick="pickDrive('fear',this)">😰 恐懼驅動</button>
        <button class="toggle-btn" data-val="value" onclick="pickDrive('value',this)">🌱 價值觀驅動</button>
        <button class="toggle-btn" data-val="mix" onclick="pickDrive('mix',this)">🔀 兩者都有</button>
      </div>

      <!-- 逃避偵測器 -->
      <div class="detector-box">
        <div class="detector-label">🔍 逃避偵測器</div>
        <p style="font-size:13px;color:#6A5000;margin:0 0 8px">這週的分析，是在服務選擇，還是在延後選擇？</p>
        <div class="detector-toggle" id="detectToggle">
          <button class="d-btn" data-val="serve" onclick="pickDetect('serve',this)">✅ 服務選擇</button>
          <button class="d-btn" data-val="delay" onclick="pickDetect('delay',this)">⏸️ 延後選擇</button>
        </div>
      </div>

      <div class="field-label" style="margin-top:12px;">下週最值得投入的一件事</div>
      <textarea id="wkNext" placeholder="只選一件，讓它成為下週的北極星…"></textarea>

      <div style="margin-top:12px"><button class="btn" onclick="saveWeekly()">儲存本週回顧</button></div>
    </div>

    <div class="card">
      <h2>過去的週回顧</h2>
      <div id="weeklyList"></div>
    </div>

    <!-- 輸出追蹤 -->
    <div class="section-title" style="margin-top:8px;">🌱 輸出追蹤</div>
    <div class="card">
      <h2>記錄一個創造</h2>
      <div class="output-type-row" id="outputTypeBtns">
        <button class="type-btn" data-val="文章" onclick="pickOutputType('文章',this)">文章</button>
        <button class="type-btn" data-val="作品" onclick="pickOutputType('作品',this)">作品</button>
        <button class="type-btn" data-val="系統" onclick="pickOutputType('系統',this)">系統</button>
        <button class="type-btn" data-val="分享" onclick="pickOutputType('分享',this)">分享</button>
        <button class="type-btn" data-val="其他" onclick="pickOutputType('其他',this)">其他</button>
      </div>
      <input type="text" id="outputInput" placeholder="這個輸出叫什麼、做了什麼？" style="margin-bottom:8px;">
      <button class="btn" onclick="addOutput()">記下這個創造</button>
    </div>
    <div class="card">
      <h2>我創造了什麼</h2>
      <div id="outputList"></div>
    </div>

  </section>
</main>

<nav>
  <button data-view="tasks" class="active" onclick="switchView('tasks',this)"><span class="ico">☑️</span>任務</button>
  <button data-view="review" onclick="switchView('review',this)"><span class="ico">🌙</span>日誌</button>
  <button data-view="mood" onclick="switchView('mood',this)"><span class="ico">💚</span>心情</button>
  <button data-view="notes" onclick="switchView('notes',this)"><span class="ico">📎</span>雜記</button>
  <button data-view="growth" onclick="switchView('growth',this)"><span class="ico">🌱</span>成長</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'personal-os-state-v1'; // 保持相同 key，向下相容
const MOOD_EMOJI = ['😞','😕','😐','🙂','😄'];
const OUTPUT_TYPES = ['文章','作品','系統','分享','其他'];
let state = { tasks:[], reviews:{}, moods:[], notes:[], weeklyReviews:[], outputs:[] };
let selectedMood = null;
let selectedDrive = null;
let selectedDetect = null;
let selectedOutputType = null;

/* ---------- 工具 ---------- */
function todayKey(d = new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function thisWeekKey(){
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0?-6:1);
  const mon = new Date(d.setDate(diff));
  return todayKey(mon);
}
function fmtTime(ts){
  const d=new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function esc(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1400);
}

/* ---------- 儲存 ---------- */
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      state=Object.assign({tasks:[],reviews:{},moods:[],notes:[],weeklyReviews:[],outputs:[]}, parsed);
    }
  }catch(e){}
  renderAll();
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
    catch(e){ toast('⚠️ 儲存失敗，空間可能已滿'); }
  },250);
}

/* ---------- 備份 ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='neil-os-backup-'+todayKey()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('備份已下載');
}

/* ---------- 導覽 ---------- */
const TITLES={tasks:'任務',review:'日誌',mood:'心情',notes:'雜記',growth:'成長'};
function switchView(name,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('viewTitle').textContent=TITLES[name];
  const showPulse = (name==='tasks'||name==='mood');
  document.getElementById('pulse').style.display=showPulse?'flex':'none';
  document.getElementById('pulseLabel').style.display=showPulse?'block':'none';
  if(name==='review') loadTodayReview();
  if(name==='growth') loadThisWeekly();
}

/* ---------- 任務 ---------- */
function addTask(){
  const inp=document.getElementById('taskInput');
  const txt=inp.value.trim();
  if(!txt) return;
  state.tasks.unshift({id:Date.now(),txt,done:false,ts:Date.now()});
  inp.value='';
  save(); renderTasks(); toast('已加入任務');
}
function toggleTask(id){
  const t=state.tasks.find(t=>t.id===id);
  if(t){t.done=!t.done; save(); renderTasks();}
}
function delTask(id){
  state.tasks=state.tasks.filter(t=>t.id!==id);
  save(); renderTasks();
}
function renderTasks(){
  const open=state.tasks.filter(t=>!t.done);
  const done=state.tasks.filter(t=>t.done);
  const html=t=>`
    <div class="task ${t.done?'done':''}">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})">
      <div class="txt">${esc(t.txt)}</div>
      <button class="del" onclick="delTask(${t.id})" aria-label="刪除">✕</button>
    </div>`;
  document.getElementById('taskListOpen').innerHTML=
    open.length?open.map(html).join(''):'<div class="empty-hint">目前沒有進行中的任務 🎉</div>';
  document.getElementById('taskListDone').innerHTML=
    done.length?done.map(html).join(''):'<div class="empty-hint">完成任務後會出現在這裡</div>';
}

/* ---------- 日誌（升級版複盤） ---------- */
function loadTodayReview(){
  const r=state.reviews[todayKey()];
  document.getElementById('rvCompass').value = r?r.compass||'':'';
  document.getElementById('rvGood').value   = r?r.good||'':'';
  document.getElementById('rvStuck').value  = r?r.stuck||'':'';
  document.getElementById('rvNext').value   = r?r.next||'':'';
  document.getElementById('reviewSaved').textContent   = r?'已儲存 ✓':'';
  document.getElementById('compassSaved').textContent  = (r&&r.compass)?'✓':'';
}
function saveReview(){
  const compass= document.getElementById('rvCompass').value.trim();
  const good   = document.getElementById('rvGood').value.trim();
  const stuck  = document.getElementById('rvStuck').value.trim();
  const next   = document.getElementById('rvNext').value.trim();
  if(!compass&&!good&&!stuck&&!next){toast('先寫點什麼吧 ✍️'); return;}
  state.reviews[todayKey()]={compass,good,stuck,next,ts:Date.now()};
  save(); renderReviews(); loadTodayReview(); toast('今日日誌已儲存');
}
function renderReviews(){
  const keys=Object.keys(state.reviews).sort().reverse().filter(k=>k!==todayKey());
  const el=document.getElementById('reviewList');
  if(!keys.length){el.innerHTML='<div class="empty-hint">過去的日誌會累積在這裡</div>'; return;}
  el.innerHTML=keys.slice(0,30).map(k=>{
    const r=state.reviews[k];
    const parts=[];
    if(r.compass) parts.push('🧭 '+esc(r.compass));
    if(r.good)    parts.push('✅ '+esc(r.good));
    if(r.stuck)   parts.push('🪨 '+esc(r.stuck));
    if(r.next)    parts.push('🎯 '+esc(r.next));
    return `<div class="review-item"><div class="review-date">${k}</div><div class="review-body">${parts.join('\n')}</div></div>`;
  }).join('');
}

/* ---------- 心情 ---------- */
function renderMoodBtns(){
  document.getElementById('moodBtns').innerHTML=MOOD_EMOJI.map((e,i)=>
    `<button class="mood-btn ${selectedMood===i+1?'sel':''}" onclick="pickMood(${i+1})">${e}</button>`).join('');
}
function pickMood(l){selectedMood=l; renderMoodBtns();}
function addMood(){
  if(!selectedMood){toast('先選一個心情吧'); return;}
  const note=document.getElementById('moodNote').value.trim();
  state.moods.unshift({id:Date.now(),level:selectedMood,note,ts:Date.now()});
  document.getElementById('moodNote').value='';
  selectedMood=null;
  save(); renderMoodBtns(); renderMoods(); renderPulse(); toast('心情已記錄');
}
function delMood(id){
  state.moods=state.moods.filter(m=>m.id!==id);
  save(); renderMoods(); renderPulse();
}
function renderMoods(){
  const el=document.getElementById('moodList');
  if(!state.moods.length){el.innerHTML='<div class="empty-hint">還沒有心情紀錄</div>'; return;}
  el.innerHTML=state.moods.slice(0,50).map(m=>`
    <div class="mood-item">
      <div class="mood-emoji">${MOOD_EMOJI[m.level-1]}</div>
      <div style="flex:1">
        ${m.note?`<div>${esc(m.note)}</div>`:''}
        <div class="mood-meta">${fmtTime(m.ts)}</div>
      </div>
      <button class="del" onclick="delMood(${m.id})" aria-label="刪除">✕</button>
    </div>`).join('');
}
function renderPulse(){
  const byDay={};
  state.moods.forEach(m=>{
    const k=todayKey(new Date(m.ts));
    if(!byDay[k]) byDay[k]=m.level;
  });
  let html='';
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const lv=byDay[todayKey(d)];
    html+=`<span class="${lv?'l'+lv:'empty'}"></span>`;
  }
  document.getElementById('pulse').innerHTML=html;
}

/* ---------- 雜記 ---------- */
function addNote(){
  const inp=document.getElementById('noteInput');
  const txt=inp.value.trim();
  if(!txt) return;
  state.notes.unshift({id:Date.now(),txt,ts:Date.now()});
  inp.value='';
  save(); renderNotes(); toast('已存入雜記');
}
function delNote(id){
  state.notes=state.notes.filter(n=>n.id!==id);
  save(); renderNotes();
}
function renderNotes(){
  const el=document.getElementById('noteList');
  if(!state.notes.length){el.innerHTML='<div class="empty-hint">雜項、靈感、備忘都丟這裡</div>'; return;}
  el.innerHTML=state.notes.map(n=>`
    <div class="note-item">
      <div class="note-txt">${esc(n.txt)}</div>
      <div class="note-meta">
        <span class="mood-meta">${fmtTime(n.ts)}</span>
        <button class="del" onclick="delNote(${n.id})" aria-label="刪除">✕</button>
      </div>
    </div>`).join('');
}

/* ---------- 週回顧 ---------- */
function pickDrive(val,btn){
  selectedDrive=val;
  document.querySelectorAll('#driveToggle .toggle-btn').forEach(b=>{
    b.className='toggle-btn';
    if(b.dataset.val===val) b.className=`toggle-btn sel-${val}`;
  });
}
function pickDetect(val,btn){
  selectedDetect=val;
  document.querySelectorAll('#detectToggle .d-btn').forEach(b=>{
    b.className='d-btn';
    if(b.dataset.val===val) b.className='d-btn sel';
  });
}
function loadThisWeekly(){
  const wk=state.weeklyReviews.find(w=>w.weekKey===thisWeekKey());
  document.getElementById('wkDecisions').value=wk?wk.decisions||'':'';
  document.getElementById('wkWhy').value=wk?wk.why||'':'';
  document.getElementById('wkNext').value=wk?wk.next||'':'';
  document.getElementById('weeklySaved').textContent=wk?'已儲存 ✓':'';
  selectedDrive=wk?wk.drive||null:null;
  selectedDetect=wk?wk.detect||null:null;
  // reset buttons
  document.querySelectorAll('#driveToggle .toggle-btn').forEach(b=>{
    b.className='toggle-btn';
    if(selectedDrive&&b.dataset.val===selectedDrive) b.className=`toggle-btn sel-${selectedDrive}`;
  });
  document.querySelectorAll('#detectToggle .d-btn').forEach(b=>{
    b.className='d-btn';
    if(selectedDetect&&b.dataset.val===selectedDetect) b.className='d-btn sel';
  });
}
function saveWeekly(){
  const decisions=document.getElementById('wkDecisions').value.trim();
  const why=document.getElementById('wkWhy').value.trim();
  const next=document.getElementById('wkNext').value.trim();
  if(!decisions&&!why&&!next){toast('先寫點什麼吧 ✍️'); return;}
  const wk=thisWeekKey();
  const idx=state.weeklyReviews.findIndex(w=>w.weekKey===wk);
  const entry={weekKey:wk,decisions,why,drive:selectedDrive,detect:selectedDetect,next,ts:Date.now()};
  if(idx>=0) state.weeklyReviews[idx]=entry;
  else state.weeklyReviews.unshift(entry);
  save(); renderWeeklyList(); loadThisWeekly(); toast('本週回顧已儲存');
}
const DRIVE_LABELS={fear:'😰 恐懼驅動',value:'🌱 價值觀驅動',mix:'🔀 兩者都有'};
const DETECT_LABELS={serve:'✅ 服務選擇',delay:'⏸️ 延後選擇'};
function renderWeeklyList(){
  const past=state.weeklyReviews.filter(w=>w.weekKey!==thisWeekKey()).sort((a,b)=>b.weekKey.localeCompare(a.weekKey));
  const el=document.getElementById('weeklyList');
  if(!past.length){el.innerHTML='<div class="empty-hint">週回顧會在這裡累積</div>'; return;}
  el.innerHTML=past.slice(0,12).map(w=>{
    const parts=[];
    if(w.decisions) parts.push('🗳️ '+esc(w.decisions));
    if(w.why)       parts.push('💭 '+esc(w.why));
    if(w.next)      parts.push('🎯 '+esc(w.next));
    const driveTag=w.drive?`<span class="weekly-tag tag-${w.drive}">${DRIVE_LABELS[w.drive]}</span>`:'';
    const detectTag=w.detect?`<span class="weekly-tag ${w.detect==='serve'?'tag-serve':'tag-delay'}">${DETECT_LABELS[w.detect]}</span>`:'';
    return `<div class="weekly-item">
      <div class="weekly-date">週次：${w.weekKey} 起</div>
      <div class="weekly-body">${parts.join('\n')}</div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">${driveTag}${detectTag}</div>
    </div>`;
  }).join('');
}

/* ---------- 輸出追蹤 ---------- */
function pickOutputType(val,btn){
  selectedOutputType=val;
  document.querySelectorAll('.type-btn').forEach(b=>{
    b.className='type-btn';
    if(b.dataset.val===val) b.className='type-btn sel';
  });
}
function addOutput(){
  const txt=document.getElementById('outputInput').value.trim();
  if(!txt){toast('寫下這個輸出的名稱'); return;}
  if(!selectedOutputType){toast('先選一個類型'); return;}
  state.outputs.unshift({id:Date.now(),type:selectedOutputType,txt,ts:Date.now()});
  document.getElementById('outputInput').value='';
  selectedOutputType=null;
  document.querySelectorAll('.type-btn').forEach(b=>b.className='type-btn');
  save(); renderOutputs(); toast('🌱 創造已記錄！');
}
function delOutput(id){
  state.outputs=state.outputs.filter(o=>o.id!==id);
  save(); renderOutputs();
}
function renderOutputs(){
  const el=document.getElementById('outputList');
  if(!state.outputs.length){el.innerHTML='<div class="empty-hint">每一個輸出都是你留給世界的痕跡</div>'; return;}
  el.innerHTML=state.outputs.map(o=>`
    <div class="output-item">
      <div class="output-type-badge">${esc(o.type)}</div>
      <div style="flex:1">
        <div class="output-txt">${esc(o.txt)}</div>
        <div class="output-meta">${fmtTime(o.ts)}</div>
      </div>
      <button class="del" onclick="delOutput(${o.id})" aria-label="刪除">✕</button>
    </div>`).join('');
}

/* ---------- 初始化 ---------- */
function renderAll(){
  renderTasks(); renderReviews(); loadTodayReview();
  renderMoodBtns(); renderMoods(); renderPulse();
  renderNotes(); renderWeeklyList(); renderOutputs();
}
(function init(){
  const d=new Date();
  const wk=['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('todayLabel').textContent=
    `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 星期${wk}`;
  document.getElementById('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter') addTask();});
  load();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible') reg.update();
      });
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      location.reload();
    });
  }
})();
</script>
</body>
</html>
